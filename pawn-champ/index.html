  <div id="game">
    <div id="stage">
      <canvas id="scene" width="640" height="360"></canvas>
      <div id="week-banner" class="plaque hidden"><span id="week-text">Week 1</span></div>
      <div id="toasts"></div>
      <div id="bubble" class="bubble hidden"><div class="who"></div><div class="txt"></div><div class="more">&#9660;</div></div>
      <div id="narration" class="narration hidden"><div class="txt"></div><div class="more">&#9660;</div></div>
      <div id="card" class="card hidden"></div>
      <div id="choices" class="choices hidden"></div>
      <div id="fade"></div>
    </div>
    <div id="panel">
      <div id="stock-grid" title="Your stock (24 places)"></div>
      <div id="resources"></div>
      <div id="panel-right"></div>
    </div>
    <div id="menu">
      <button class="plaque-btn" data-menu="ledger">Ledger</button>
      <button class="plaque-btn" data-menu="calendar">Calendar</button>
      <button class="plaque-btn" data-menu="stock">Stock</button>
      <button class="plaque-btn" data-menu="notices">Notices</button>
      <button class="plaque-btn" data-menu="goals">Goals</button>
      <button class="plaque-btn" data-menu="options">Options</button>
    </div>
    <!-- covers the whole game (stage, panel and menu) so tall menus like New game and Storybook fit -->
    <div id="title" class="hidden"></div>
  </div>
  <div id="modal" class="hidden"><div class="modal-box"></div></div>
