<header class="c-page__header">
  <a class="c-page__brand no-hov" href="{{ "/" | prepend: site.baseurl }}"><code>{{ site.title }}</code></a>
  <nav class="c-page__nav" aria-label="Main">
    {% for item in site.data.navigation %}
    {% assign is_current = false %}
    {% if page.url == item.link %}{% assign is_current = true %}{% endif %}
    <a href="{{ item.link | prepend: site.baseurl }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
