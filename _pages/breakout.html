<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.::SUPER BREAKOUT::.</title>
<script src="/assets/js/detectdevice.js"></script>
<script src="/assets/js/breakout.js"></script>
<script src="/assets/js/sprites.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: white;
}

#canvas {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
</style>
<script>
window.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('canvas').getContext('2d');
    let HEIGHT = ctx.canvas.height = window.innerHeight;
    let WIDTH = ctx.canvas.width = window.innerWidth;
    const d = new Device();
    const game = new Game(WIDTH, HEIGHT);
    const timer = new FrameTimer();
    timer.tick();
    const timerinterval = 1;

    function clear() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);
    }

    function draw() {
        clear();
        game.draw(ctx, timer.getSeconds());
        timer.tick();
    }

    setInterval(draw, timerinterval);

    document.addEventListener('keydown', function(evt) {
        if (evt.key === 'ArrowRight') game.moveright();
        else if (evt.key === 'ArrowLeft') game.moveleft();
        else if (evt.key === 'p' || evt.key === 'P') game.pause();
        else if (evt.key === 'z' || evt.key === 'Z') game.speed();
        else if (evt.key === 'x' || evt.key === 'X') game.slow();
        else if (evt.key === 'v' || evt.key === 'V') game.embiggen();
        else if (evt.key === 'c' || evt.key === 'C') game.shrink();
        else if (evt.key === 'd' || evt.key === 'D') game.invinsible();
        else if (evt.key === 'f' || evt.key === 'F') game.paddlewidth(200);
        else if (evt.key === 'i' || evt.key === 'I') game.toggleInstructions();
    });

    if (!d.detectAndroid()) {
        document.querySelector('canvas').addEventListener('mousemove', function(e) {
            game.mousemove(e.clientX);
        });
    }

    document.getElementById('canvas').addEventListener('click', function() {
        if (game.gameover) {
            game.reset();
        } else if (!game.started) {
            game.startgame();
        } else if (!game.live && !game.gameover) {
            game.launchBall();
        }
    });

    if (d.detectAndroid()) {
        document.getElementById('canvas').addEventListener('touchmove', function(event) {
            game.mousemove(event.targetTouches[0].clientX);
        });
    }

    // Handle window resize
    window.addEventListener('resize', function() {
        HEIGHT = ctx.canvas.height = window.innerHeight;
        WIDTH = ctx.canvas.width = window.innerWidth;
        game.width = WIDTH;
        game.height = HEIGHT;
    });
});
</script>
</head>
<body>	
  <canvas id="canvas" role="application" aria-label="Breakout game. Use arrow keys to move the paddle. Press P to pause, I to toggle instructions."></canvas>
</body>
</html>
